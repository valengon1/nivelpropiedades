[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "/ficha/*"
  to = "/ficha/index"
  status = 200

[[redirects]]
  from = "/propiedad-*"
  to = "/"
  status = 200

[[redirects]]
  from = "/venta"
  to = "/"
  status = 200

[[redirects]]
  from = "/alquileres"
  to = "/"
  status = 200
